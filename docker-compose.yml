services:
  app:
    build:
      context: .
      target: runtime
    image: focus-todo-app:local
    restart: unless-stopped
    init: true
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-focus_todo}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-focus_todo}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-focus_todo}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--Dfile.encoding=UTF-8}
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-focus_todo}
      POSTGRES_USER: ${POSTGRES_USER:-focus_todo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-focus_todo}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
